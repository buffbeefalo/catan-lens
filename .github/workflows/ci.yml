name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 bench/catanatron/verify_holdout.py
      - run: python3 bench/catanatron/verify_owned_harbours.py
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run report -- 100
